name: Build & Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate and Install Composer
        run: |
          composer validate --no-check-publish
          composer install --no-dev --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit

      - name: Setup Target Host and Run Tests
        run: |
          git clone --depth=1 https://github.com/leconfe/leconfe.git /tmp/leconfe
          cd /tmp/leconfe
          composer install --no-interaction --prefer-dist
          cd -
          composer run test
        env:
          LECONFE_PATH: /tmp/leconfe

      - name: Package plugin
        id: package
        run: |
          plugin_folder="$(awk -F ': ' '$1 == "folder" { print $2; exit }' index.yaml)"

          if [ -z "$plugin_folder" ]; then
            echo "Plugin folder is missing from index.yaml"
            exit 1
          fi

          mkdir -p "release/$plugin_folder"
          rsync -a ./ "release/$plugin_folder/" \
            --exclude release \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude tests

          archive_name="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.zip"
          (
            cd release
            zip -r "../$archive_name" "$plugin_folder"
          )

          echo "archive_path=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive_path }}
